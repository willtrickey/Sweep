<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweep</title>
    <!--
        Interim holding page.

        This address used to serve the privacy policy itself, and builds of the
        app already in testers' hands open it expecting exactly that — so it
        redirects rather than 404s. The policy now lives at its own stable
        address, which is where the app points from the next build onwards.

        When the marketing page is ready it replaces this file. By then no
        build in circulation depends on this address serving the policy, so
        the swap breaks nothing.
    -->
    <meta http-equiv="refresh" content="0; url=privacy.html">
    <link rel="canonical" href="privacy.html">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <main>
            <!-- Shown only if the redirect above doesn't fire. -->
            <p>The Sweep privacy policy has moved to <a href="privacy.html">privacy.html</a>.</p>
        </main>
    </div>
    <script>
        location.replace('privacy.html');
    </script>
</body>
</html>
